<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Sistema Inventario</title>
    <link rel="icon" type="image/x-icon" href="./assets/favicon.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body
    class="bg-light d-flex align-items-center justify-content-center vh-100"
  >
    <div class="card shadow-lg p-4" style="width: 22rem">
      <figure class="text-center m-3">
        <img
          src="./assets/digital_andes_logo.png"
          alt="Digital Andes"
          class="mb-3 img-fluid login-logo"
          style="width: 150px; max-width: 60%; height: auto"
        />
      </figure>
      <h4 class="text-center mb-3">Iniciar Sesión</h4>
      <p>El usuario de prueba es: admin</p>
      <p>El password de prueba es: 1234</p>
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label">Usuario</label>
          <input
            type="text"
            class="form-control"
            id="username"
            placeholder="Ingresa tu usuario"
            required
          />
        </div>
        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input
            type="password"
            class="form-control"
            id="password"
            placeholder="Ingresa tu contraseña"
            required
          />
        </div>
        <button type="submit" class="btn btn-primary w-100">Entrar</button>
        <div id="loginError" class="text-danger mt-2"></div>
      </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/main.js"></script>
  </body>
</html>
